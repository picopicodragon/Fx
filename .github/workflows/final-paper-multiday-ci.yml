name: Final paper multi-day quote and official archive integrity

on:
  pull_request:
    paths:
      - 'research/final_paper_multiday_quote_stress.py'
      - 'research/final_paper_official_archive_integrity.py'
      - 'scripts/final_paper_multiday_macro_integrity_once.ps1'
      - 'tests/test_final_paper_multiday_archive_integrity.py'
      - '.github/workflows/final-paper-multiday-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Python 3.12 complete safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests scripts
      - run: python -m unittest discover -s tests -p 'test*.py'

  windows:
    name: Windows Python 3.13 complete suite and PowerShell AST
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate read-only handoff PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/final_paper_multiday_macro_integrity_once.ps1',
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: python -m unittest discover -s tests -p "test*.py"
