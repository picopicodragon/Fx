name: Final paper supervisor incident safety

on:
  pull_request:
    paths:
      - 'research/final_paper_supervisor_incident.py'
      - 'scripts/final_paper_supervisor_incident_once.ps1'
      - 'scripts/final_paper_collect_external_evidence_once.ps1'
      - 'tests/test_final_paper_supervisor_incident.py'
      - '.github/workflows/final-paper-supervisor-incident-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Python 3.12 all tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests scripts
      - run: python -m unittest discover -s tests -p 'test*.py'

  windows:
    name: Windows Python 3.13 all tests and PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Parse live-handoff PowerShell scripts
        shell: pwsh
        run: |
          foreach ($p in @('scripts/final_paper_supervisor_incident_once.ps1','scripts/final_paper_collect_external_evidence_once.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - run: python -m unittest discover -s tests -p "test*.py"
