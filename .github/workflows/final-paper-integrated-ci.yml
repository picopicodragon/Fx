name: Final integrated AI macro safety virtual execution and budget

on:
  pull_request:
    paths:
      - 'research/final_paper_integrated_control.py'
      - 'research/final_paper_integrated_rehearsal.py'
      - 'research/final_paper_integrated_readiness.py'
      - 'research/final_paper_runtime.py'
      - 'scripts/final_paper_integrated_ai_virtual_once.ps1'
      - 'tests/test_final_paper_integrated_control.py'
      - '.github/workflows/final-paper-integrated-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Python 3.12 full-suite final AI integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests
      - run: python -m unittest discover -s tests -p 'test*.py'
  windows:
    name: Windows Python 3.13 full-suite and PS parser
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Parse integrated no-order PowerShell
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/final_paper_integrated_ai_virtual_once.ps1',
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: python -m unittest discover -s tests -p "test*.py"
