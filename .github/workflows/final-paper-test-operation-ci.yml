name: Final paper single-command observation test operation

on:
  pull_request:
    paths:
      - 'research/final_paper_final_test_operation.py'
      - 'scripts/final_paper_start_final_test_v1_once.ps1'
      - 'tests/test_final_paper_final_test_operation.py'
      - '.github/workflows/final-paper-test-operation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Python 3.12 final test full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests
      - run: python -m unittest discover -s tests -p 'test*.py'
  windows:
    name: Windows Python 3.13 final test full suite and PS parser
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate one-command Windows grammar
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/final_paper_start_final_test_v1_once.ps1',
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: python -m unittest discover -s tests -p 'test*.py'