name: Final paper frozen MQL4 quote and historical time-order audit

on:
  pull_request:
    paths:
      - 'mt4/read_only/FxFinalPaperReadOnlyObserver.mq4'
      - 'research/final_paper_quote_time_order_campaign.py'
      - 'scripts/final_paper_quote_time_order_campaign_once.ps1'
      - 'tests/test_final_paper_quote_time_order_campaign.py'
      - '.github/workflows/final-paper-clock-race-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Python 3.12 complete no-order suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests
      - run: python -m unittest discover -s tests -p 'test*.py'
  windows:
    name: Windows Python 3.13 complete suite and PS syntax
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate forensic PowerShell grammar
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/final_paper_quote_time_order_campaign_once.ps1',
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: python -m unittest discover -s tests -p "test*.py"
