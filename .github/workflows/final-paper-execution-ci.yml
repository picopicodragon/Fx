name: Final paper source-linked E2E pipeline

on:
  pull_request:
    paths:
      - 'research/final_paper_completed_decision.py'
      - 'research/final_paper_e2e_replay.py'
      - 'research/final_paper_api_cost_envelope.py'
      - 'research/final_paper_point_in_time_evidence.py'
      - 'research/final_paper_runtime.py'
      - 'tests/test_final_paper_source_linked_e2e.py'
      - 'tests/test_final_paper_evidence_costs.py'
      - '.github/workflows/final-paper-execution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux Python 3.12 whole-suite safety check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests scripts
      - run: python scripts/check_traceability.py
      - run: python scripts/check_acceptance.py
      - run: python -m unittest discover -s tests -p 'test*.py'

  windows:
    name: Windows Python 3.13 whole-suite safety check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test*.py"
