name: Final paper five-gate read-only regression

on:
  pull_request:
    paths:
      - 'research/final_paper_five_gate_readiness.py'
      - 'scripts/final_paper_live_supervisor_check_once.ps1'
      - 'tests/test_final_paper_five_gate_readiness.py'
      - '.github/workflows/final-paper-five-gates-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-linux:
    name: Linux 3.12 final-paper suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests
      - run: python -m unittest discover -s tests -p 'test_final_paper*.py' -v

  python-windows:
    name: Windows 3.13 final-paper suite
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test_final_paper*.py"
