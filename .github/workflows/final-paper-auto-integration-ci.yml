name: Final full-auto AI virtual integration and authorization gates

on:
  pull_request:
    paths:
      - 'research/final_paper_auto_*.py'
      - 'research/final_paper_current_comm_release.py'
      - 'research/final_paper_final_auto_preflight.py'
      - 'research/final_paper_runtime.py'
      - 'research/final_paper_engine.py'
      - 'scripts/final_paper_start_full_auto_virtual_only.ps1'
      - 'tests/test_final_paper_auto_*.py'
      - '.github/workflows/final-paper-auto-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full:
    name: Linux Python 3.12 full virtual-only integration safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q research tests
      - run: python -m unittest discover -s tests -p 'test*.py'
  windows-full:
    name: Windows Python 3.13 full integration and PowerShell parse
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Parse human-only full-auto startup PowerShell
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/final_paper_start_full_auto_virtual_only.ps1',
            [ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: python -m unittest discover -s tests -p "test*.py"
